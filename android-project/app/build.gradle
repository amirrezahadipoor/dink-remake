apply plugin: 'com.android.application'

android {
    namespace "ir.pigkeeper.dink"
    compileSdk 35
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "ir.pigkeeper.dink"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0-alpha"

        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-23", "-j4"
                abiFilters "arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
