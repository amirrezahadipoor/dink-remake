name: CI

on:
  push:
  workflow_dispatch:

jobs:
  engine-linux:
    name: Build engine (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake gettext autopoint pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libsdl2-gfx-dev \
            libfontconfig1-dev libfreetype-dev zlib1g-dev cxxtest libglm-dev
          # modern SDL2_gfx renamed the header; engine expects the old name
          test -f /usr/include/SDL2/SDL_framerate.h || \
            sudo ln -s SDL2_framerate.h /usr/include/SDL2/SDL_framerate.h

      - name: Fix autotools timestamps (git does not preserve mtimes)
        working-directory: engine
        run: |
          touch configure.ac autotools/* m4/*.m4 2>/dev/null || true
          sleep 1; touch aclocal.m4
          sleep 1; touch configure config.h.in
          sleep 1; find . -name 'Makefile.in' -exec touch {} +

      - name: Configure
        working-directory: engine
        env:
          CPPFLAGS: -I/usr/include/SDL2
        run: |
          ./configure || { echo "::group::config.log"; cat config.log; echo "::endgroup::"; exit 1; }

      - name: Build
        working-directory: engine
        run: make -j"$(nproc)"

      - name: Upload engine binary
        uses: actions/upload-artifact@v4
        with:
          name: freedink-linux
          path: engine/src/freedink
          if-no-files-found: error

      - name: Smoke test (headless boot to title + interaction)
        run: |
          sudo apt-get install -y xvfb imagemagick xdotool fonts-liberation webp
          sh fetch-data.sh
          export SDL_AUDIODRIVER=dummy
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 2
          ./engine/src/freedink --refdir "$PWD/gamedata" --window --debug > freedink.log 2>&1 &
          PID=$!
          sleep 20
          import -window root shot_title.png || true
          ALIVE_TITLE=ok; kill -0 $PID 2>/dev/null || ALIVE_TITLE=dead
          # engine uses SDL relative-warp mouse: steer with many SMALL relative moves
          # in-game pointer starts at (320,240); Start button ~ (60,45) => delta (-260,-195)
          xdotool mousemove 640 360 || true
          sleep 1
          for s in $(seq 1 13); do xdotool mousemove_relative -- -20 -15 || true; sleep 0.15; done
          sleep 1
          import -window root shot_mid.png || true
          xdotool click 1 || true
          sleep 2
          xdotool click 1 || true
          sleep 10
          xdotool key Return || true
          sleep 5
          import -window root shot_after.png || true
          ALIVE_AFTER=ok; kill -0 $PID 2>/dev/null || ALIVE_AFTER=dead
          kill $PID 2>/dev/null || true
          echo "::group::freedink.log (tail)"; tail -60 freedink.log; echo "::endgroup::"
          # compress screenshots (project rule: screenshots must be small)
          convert shot_title.png -resize 800x smoke_title.webp || true
          convert shot_mid.png -resize 800x smoke_mid.webp || true
          convert shot_after.png -resize 800x smoke_after.webp || true
          ls -la smoke_*.webp || true
          echo "title: $ALIVE_TITLE | after-interaction: $ALIVE_AFTER"
          test "$ALIVE_TITLE" = ok
          test "$ALIVE_AFTER" = ok

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            smoke_*.webp
            freedink.log
          if-no-files-found: warn

  data-check:
    name: Fetch & verify game data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base game data
        run: sh fetch-data.sh
      - name: Verify layout
        run: |
          test -f gamedata/dink/Map.dat
          test -f gamedata/dink/Hard.dat
          test -d gamedata/dink/graphics
          test -d gamedata/dink/Story
          echo "data OK: $(du -sh gamedata | cut -f1)"
