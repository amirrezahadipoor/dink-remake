name: CI

on:
  push:
  workflow_dispatch:

# audit#2: cancel superseded runs — faster feedback, less queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-linux:
    name: Build engine (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake gettext autopoint pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libsdl2-gfx-dev \
            libfontconfig1-dev libfreetype-dev zlib1g-dev cxxtest libglm-dev
          # modern SDL2_gfx renamed the header; engine expects the old name
          test -f /usr/include/SDL2/SDL_framerate.h || \
            sudo ln -s SDL2_framerate.h /usr/include/SDL2/SDL_framerate.h

      - name: Fix autotools timestamps (git does not preserve mtimes)
        working-directory: engine
        run: |
          touch configure.ac autotools/* m4/*.m4 2>/dev/null || true
          sleep 1; touch aclocal.m4
          sleep 1; touch configure config.h.in
          sleep 1; find . -name 'Makefile.in' -exec touch {} +

      - name: Configure
        working-directory: engine
        env:
          CPPFLAGS: -I/usr/include/SDL2
        run: |
          ./configure || { echo "::group::config.log"; cat config.log; echo "::endgroup::"; exit 1; }

      - name: Build (game binary only — editor/man race excluded)
        working-directory: engine
        run: |
          make -j2 -C gnulib/lib
          make -j2 -C po || true
          make -j2 -C src freedink

      - name: Upload engine binary
        uses: actions/upload-artifact@v4
        with:
          name: freedink-linux
          path: engine/src/freedink
          if-no-files-found: error

      - name: Smoke test (headless boot to title + autostart into game)
        run: |
          sudo apt-get install -y xvfb imagemagick fonts-liberation webp
          sh fetch-data.sh
          sh tools/ci/autostart-patch.sh
          export SDL_AUDIODRIVER=dummy
          export FREEDINK_FONT="$PWD/fonts/Vazirmatn-Regular.ttf"
          export FREEDINK_AUTOSAVE=8
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 2
          ./engine/src/freedink --refdir "$PWD/gamedata" --window --debug --truecolor > freedink.log 2>&1 &
          PID=$!
          sleep 12
          import -window root shot_title.png || true
          ALIVE_TITLE=ok; kill -0 $PID 2>/dev/null || ALIVE_TITLE=dead
          # autostart script fires ~15s after boot -> wait for in-game state
          sleep 25
          import -window root shot_after.png || true
          ALIVE_AFTER=ok; kill -0 $PID 2>/dev/null || ALIVE_AFTER=dead
          kill $PID 2>/dev/null || true
          echo "::group::freedink.log (tail)"; tail -60 freedink.log; echo "::endgroup::"
          # compress screenshots (project rule: screenshots must be small)
          convert shot_title.png -resize 800x smoke_title.webp || true
          convert shot_after.png -resize 800x smoke_after.webp || true
          ls -la smoke_*.webp || true
          echo "title: $ALIVE_TITLE | in-game: $ALIVE_AFTER"
          test "$ALIVE_TITLE" = ok
          test "$ALIVE_AFTER" = ok
          grep -q "CI_AUTOSTART_OK" freedink.log
          grep -q "CI_PERSIAN_SAY" freedink.log
          grep -q "FREEDINK_FONT" freedink.log
          # --- 2-6 / 2-7: atomic save, journal, autosave ---
          grep -q "CI_SAVED_7" freedink.log
          grep -q "SAVE_ATOMIC_OK: slot 7" freedink.log
          grep -q "JOURNAL_ADD" freedink.log
          grep -q "JOURNAL_DONE" freedink.log
          grep -q "JOURNAL_SAVED: slot 7 (2 quests)" freedink.log
          grep -q "AUTOSAVE_OK: slot 9" freedink.log
          SAVE7=$(find ~/.dink -name 'save7.dat' | head -1); test -n "$SAVE7"
          test ! -f "$SAVE7.tmp"
          J7=$(find ~/.dink -name 'journal7.txt' | head -1); test -n "$J7"
          grep -q "پیدا کردن تیلی" "$J7"
          grep -q "^1|" "$J7"
          grep -q "^0|" "$J7"
          find ~/.dink -name 'save9.dat' | grep -q .
          echo "save/journal/autosave checks passed ✓"
          # --- 2-8 / 2-9: story flags, clock, night ---
          grep -q "CI_FLAG_OK" freedink.log
          grep -q "CI_DAY_OK" freedink.log
          grep -q "CLOCK_SET: hour 22" freedink.log
          grep -q "CI_NIGHT_OK" freedink.log
          grep -q "NIGHT_TINT_ON" freedink.log
          grep -q "FLAGS_SAVED: slot 7 (2 flags)" freedink.log
          F7=$(find ~/.dink -name 'flags7.txt' | head -1); test -n "$F7"
          grep -q "CLOCK|1320" "$F7"
          grep -q "1|fire_witness" "$F7"
          grep -q "2|mayor_mood" "$F7"
          echo "flags/clock/night checks passed ✓"
          # --- perf: گزارش fps + کف سخت‌گیرانه ---
          grep -a "PERF fps=" freedink.log | tail -3
          FPSV=$(grep -a "PERF fps=" freedink.log | tail -1 | grep -oE 'fps=[0-9]+' | cut -d= -f2)
          echo "measured fps: ${FPSV:-none}"
          test -n "$FPSV" && test "$FPSV" -ge 30
          # بوت و سیو
          grep -a "PERF first_frame_ms=\|PERF save_ms=" freedink.log | head -4
          FFMS=$(grep -a "PERF first_frame_ms=" freedink.log | head -1 | grep -oE '=[0-9]+' | tr -d '=')
          echo "first frame: ${FFMS:-none} ms"
          test -n "$FFMS" && test "$FFMS" -le 15000
          echo "perf floors passed ✓"

      - name: Remake boot test (pigkeeper D-Mod, Persian title)
        run: |
          export SDL_AUDIODRIVER=dummy
          export FREEDINK_FONT="$PWD/fonts/Vazirmatn-Regular.ttf"
          export DISPLAY=:99
          cp -r pigkeeper gamedata/pigkeeper
          # phase 5: the remake now ships ITS OWN maps (tools/mapgen.py); only tileset hardness is shared
          cp gamedata/dink/Hard.dat gamedata/pigkeeper/hard.dat
          cp gamedata/dink/Dink.ini gamedata/pigkeeper/dink.ini  # ini فال‌بک ندارد (کشف #72)
          export PIG_DEMO_STOP=99   # عنوان برای کاربر واقعی می‌ماند؛ دمو فقط با این env
          ./engine/src/freedink --refdir "$PWD/gamedata" --game "$PWD/gamedata/pigkeeper" --window --debug --truecolor > pigkeeper.log 2>&1 &
          PID=$!
          sleep 7
          import -window root rshot_title.png || true
          ALIVE_T=ok; kill -0 $PID 2>/dev/null || ALIVE_T=dead
          sleep 23
          import -window root rshot_ingame.png || true
          ALIVE_G=ok; kill -0 $PID 2>/dev/null || ALIVE_G=dead
          kill $PID 2>/dev/null || true
          echo "::group::pigkeeper.log (tail)"; tail -50 pigkeeper.log; echo "::endgroup::"
          convert rshot_title.png -resize 800x remake_title.webp || true
          convert rshot_ingame.png -resize 800x remake_ingame.webp || true
          echo "title: $ALIVE_T | ingame: $ALIVE_G"
          test "$ALIVE_T" = ok
          test "$ALIVE_G" = ok
          grep -q "PIGKEEPER_BOOT_OK" pigkeeper.log
          grep -q "PIGKEEPER_INGAME" pigkeeper.log
          # فصل ۱ روی نقشه خودِ ریمیک
          grep -q "MAKE_BUTTON btnstart" pigkeeper.log
          grep -q "CH1_FARM_OK" pigkeeper.log
          grep -q "CI_TELEPORT_FOREST" pigkeeper.log
          grep -q "CH2_FOREST_OK" pigkeeper.log
          grep -q "CH2_MERCS_SPAWNED" pigkeeper.log
          grep -q "CH2_MERC_READY" pigkeeper.log
          grep -q "CI_TELEPORT_BOSS" pigkeeper.log
          grep -q "CH2_WOLF_SPAWNED" pigkeeper.log
          grep -q "CH2_WOLF_READY" pigkeeper.log
          grep -q "CI_TELEPORT_PORT" pigkeeper.log
          grep -q "CH5_PORT_OK" pigkeeper.log
          grep -q "CH5_PORT_ARRIVED" pigkeeper.log
          grep -q "CI_TELEPORT_TAVERN" pigkeeper.log
          grep -q "CH5_TAV_OK" pigkeeper.log
          grep -q "CI_TELEPORT_MINE" pigkeeper.log
          grep -q "CH6_MINE1_OK" pigkeeper.log
          grep -q "CH6_PILLS_SPAWNED" pigkeeper.log
          grep -q "CI_TELEPORT_MILO" pigkeeper.log
          grep -q "CH6_MINE2_OK" pigkeeper.log
          grep -q "CH6_MILO_HERE" pigkeeper.log
          grep -q "CI_TELEPORT_DOCK" pigkeeper.log
          grep -q "CH7_DOCK_OK" pigkeeper.log
          grep -q "CH7_RAUF_HERE" pigkeeper.log
          grep -q "CI_TELEPORT_GRIVN" pigkeeper.log
          grep -q "CH8_GRIVN_OK" pigkeeper.log
          grep -q "CH8_HOLLOW_FOLK" pigkeeper.log
          grep -q "CI_TELEPORT_CHURCH" pigkeeper.log
          grep -q "CH8_CHURCH_OK" pigkeeper.log
          grep -q "CH8_BOOK_FOUND" pigkeeper.log
          grep -q "CI_TELEPORT_CAMP" pigkeeper.log
          grep -q "CH9_CAMP_OK" pigkeeper.log
          grep -q "CI_TELEPORT_YARD" pigkeeper.log
          grep -q "CH10_YARD_OK" pigkeeper.log
          grep -q "CH10_QUEUE" pigkeeper.log
          grep -q "CI_TELEPORT_KILN" pigkeeper.log
          grep -q "CH10_KILN_OK" pigkeeper.log
          grep -q "CH10_SMOKE_READY" pigkeeper.log
          grep -q "CI_TELEPORT_TOP" pigkeeper.log
          grep -q "CH11_TOP_OK" pigkeeper.log
          grep -q "CH11_VAIL_SCENE" pigkeeper.log
          grep -q "CI_TELEPORT_SOUTH" pigkeeper.log
          grep -q "Q_SOUTH_OK" pigkeeper.log
          grep -q "Q1_FLOWERS_SET" pigkeeper.log
          grep -q "Q_SOUTH_NPCS" pigkeeper.log
          grep -q "Q6_WIDOW_HERE" pigkeeper.log
          grep -q "Q9_DIGGER_HERE" pigkeeper.log
          grep -q "Q10_SET" pigkeeper.log
          grep -q "TAV_PROPS" pigkeeper.log
          grep -q "Q7_LIGHT_HERE" pigkeeper.log
          grep -q "JOURNAL_ADD" pigkeeper.log
          grep -q "SCREEN_SHAKE" pigkeeper.log || true  # شیک فقط پس از تعامل
          echo "::group::NOTANIM diag"; grep -aiE "seq|\.ff|couldn|miss" pigkeeper.log | head -20; echo "::endgroup::"

      - name: QA gallery — per-screen screenshots (meticulous pass)
        run: |
          export SDL_AUDIODRIVER=dummy
          export FREEDINK_FONT="$PWD/fonts/Vazirmatn-Regular.ttf"
          export DISPLAY=:99
          for STOP in 2 3 5 7 8 9 10 12; do
            PIG_DEMO_STOP=$STOP ./engine/src/freedink --refdir "$PWD/gamedata" --game "$PWD/gamedata/pigkeeper" --window --debug --truecolor > qa_$STOP.log 2>&1 &
            QPID=$!
            sleep 28
            import -window root qa_shot_$STOP.png || true
            kill $QPID 2>/dev/null || true
            sleep 1
            convert qa_shot_$STOP.png -resize 800x qa_stop_$STOP.webp || true
          done
          ls -la qa_stop_*.webp

      - name: Upload remake artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remake-boot
          path: |
            remake_*.webp
            qa_stop_*.webp
            pigkeeper.log
          if-no-files-found: warn

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            smoke_*.webp
            freedink.log
          if-no-files-found: warn

  data-check:
    name: Fetch & verify game data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base game data
        run: sh fetch-data.sh
      - name: Verify layout
        run: |
          test -f gamedata/dink/Map.dat
          test -f gamedata/dink/Hard.dat
          test -d gamedata/dink/graphics
          test -d gamedata/dink/Story
          echo "data OK: $(du -sh gamedata | cut -f1)"

      - name: ffextract roundtrip selftest (all 142 archives)
        run: python3 tools/ffextract.py selftest gamedata/dink/graphics

      - name: Balance simulator (B2/B3/B4/B7 regression gate)
        run: python3 tools/balance_sim.py

      - name: Persian audit (Q3 — zero English in gameplay text)
        run: python3 tools/ci/persian-audit.py

      - name: Story audit (cross-refs, flags, journals, seqs, warps)
        run: python3 tools/ci/story-audit.py
